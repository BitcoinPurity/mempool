name: 'Print backend hashes'

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  print-backend-sha:
    runs-on: ubuntu-24.04
    name: Print backend hashes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Run script
        working-directory: repo
        run: |
          chmod +x ./scripts/get_backend_hash.sh
          sh ./scripts/get_backend_hash.sh
