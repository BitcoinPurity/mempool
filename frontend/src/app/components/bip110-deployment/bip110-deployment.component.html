<div class="main-title">BIP-110 Reduced Data Rules</div>
<div class="card-wrapper">
  <div class="card">
    <div class="card-body more-padding">
      <ng-container *ngIf="(isLoading$ | async) === false && (status$ | async) as status; else loading">
        <div class="enforcement-row">
          <div class="enforcement-description">
            <span class="state-badge" [class.active]="status.state === 'active'">
              {{ status.state === 'active' ? 'Permanently Enforced' : 'Not Yet Enforced' }}
            </span>
            <span class="state-description">Permanent Bitcoin Purity consensus rules</span>
          </div>
          <div class="enforcement-stats">
            <div class="stat" *ngIf="status.activationHeight !== null">
              <span class="stat-value">{{ status.activationHeight | number }}</span>
              <span class="stat-label">Activation height</span>
            </div>
            <div class="stat">
              <span class="stat-value">None</span>
              <span class="stat-label">Expiration</span>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-template #loading>
        <div class="enforcement-skeleton">
          <div class="skeleton-loader" style="width: 180px; height: 18px;"></div>
          <div class="skeleton-loader" style="width: 120px; height: 18px;"></div>
        </div>
      </ng-template>
    </div>
  </div>
  <!-- BIP-110 block scan progress (shown while scanning historic blocks) -->
  <ng-container *ngIf="{ pct: (bip110ScanProgress$ | async) } as scan">
    <div class="scan-progress" *ngIf="scan.pct !== null && scan.pct >= 0 && scan.pct < 100">
      <div class="scan-bar-track">
        <div class="scan-bar-fill" [style.width.%]="scan.pct"></div>
      </div>
      <span class="scan-label">Scanning blocks for BIP-110 data: {{ scan.pct | number:'1.0-0' }}%</span>
    </div>
  </ng-container>
</div>
