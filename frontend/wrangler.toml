name = "mempool"
main = "./worker.mjs"
compatibility_date = "2026-11-19"

[assets]
directory = "./dist/mempool/browser"
binding = "ASSETS"
# Deep-link navigations (e.g. /da/block/<hash>) otherwise 404 at the
# Static Assets layer before they can reach the locale-aware fallback.
# The Worker still delegates real static files to env.ASSETS.fetch().
run_worker_first = true

# Workers Builds runs the existing Angular build command first; Wrangler then
# adjusts only the /en-US/ HTML base before uploading the static assets.
[build]
command = "node ./scripts/fix-en-us-base.mjs"
